<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bauturbo Directory</title>
    
    <link rel="icon" href="/assets/favicons/logo_bauwende.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            /* Theme colors */
            --color-primary: #FF1E55;
            --color-secondary: #00115a;
            --color-background: #F9FAFB;
            --color-text: #000000;
            
            /* Fonts */
            --font-heading: Inter, system-ui, sans-serif;
            --font-body: Inter, system-ui, sans-serif;
        }
        
        body {
            font-family: var(--font-body);
            background-color: var(--color-background);
            color: var(--color-text);
        }
        
        h1, h2, h3, h4, h5, h6 {
            font-family: var(--font-heading);
        }
        
        /* Apply theme colors to various elements */
        .text-indigo-600, .text-primary {
            color: var(--color-primary) !important;
        }
        
        .bg-indigo-600, .bg-primary {
            background-color: var(--color-primary) !important;
        }
        
        .hover\:bg-indigo-700:hover {
            background-color: var(--color-secondary) !important;
        }
        
        .hover\:text-indigo-600:hover {
            color: var(--color-primary) !important;
        }
        
        .hover\:text-primary:hover {
            color: var(--color-primary) !important;
        }
        
        .border-indigo-500:focus {
            border-color: var(--color-primary) !important;
        }
        
        .ring-indigo-500:focus {
            --tw-ring-color: var(--color-primary) !important;
        }
        
        /* Custom border styles */
        .border-text {
            border-color: var(--color-text);
        }
        
        .border-1-5 {
            border-width: 1.5px;
        }
        
        html, body {
            min-height: 100vh;
            background-color: var(--color-background);
        }
        
        body {
            display: flex;
            flex-direction: column;
        }
        
        main {
            flex: 1;
        }
        
        /* Line clamp utility */
        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        /* Mobile filter toggle */
        @media (max-width: 1023px) {
            .filter-sidebar {
                position: fixed;
                top: 0;
                left: -100%;
                height: 100vh;
                width: 80%;
                max-width: 320px;
                background-color: var(--color-background);
                z-index: 50;
                transition: left 0.3s ease;
                overflow-y: auto;
                box-shadow: 2px 0 8px rgba(0,0,0,0.1);
                padding: 1rem;
            }
            
            .filter-sidebar.open {
                left: 0;
            }
            
            .filter-overlay {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(0,0,0,0.5);
                z-index: 40;
                display: none;
            }
            
            .filter-overlay.open {
                display: block;
            }
        }
        
        /* Link styling for article content */
        .prose a {
            color: var(--color-text);
            text-decoration: underline;
            text-decoration-color: var(--color-primary);
            text-decoration-thickness: 1.5px;
            text-underline-offset: 2px;
        }
        
        .prose a:hover {
            color: var(--color-primary);
        }
        
        /* Custom focus styles for form elements */
        select:focus,
        input:focus,
        textarea:focus,
        button:focus {
            outline: none;
            border-color: var(--color-text) !important;
            box-shadow: 0 0 0 1px var(--color-text) !important;
        }
        
        .filter-select:focus {
            border-color: var(--color-text) !important;
            box-shadow: 0 0 0 1px var(--color-text) !important;
        }
    </style>
</head>
<body class="text-gray-900 font-sans">
    <header style="background-color: var(--color-background);">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-primary">
                
                <img src="/assets/logos/logo_bauwende.png" alt="Bauturbo Directory" class="h-8 inline-block">
                
            </h1>
            <nav class="flex gap-6">
                
                <a href="/projekte" class="text-gray-600 hover:text-primary transition-colors">
                    Projekte
                </a>
                
                <a href="/praxis" class="text-gray-600 hover:text-primary transition-colors">
                    Kommunale Praxis
                </a>
                
                
                
                <a href="https://umsetzungslabor-bauturbo.de/" 
                   target="_blank" rel="noopener noreferrer"
                   class="text-gray-600 hover:text-primary transition-colors">
                    About
                </a>
                
                
            </nav>
        </div>
    </header>

    <main class="py-8">
        


<script>

    Click here if you are not redirected automatically
  </a>
</div>

    </main>

    <footer style="background-color: var(--color-background);">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
            <div class="flex justify-between items-center">
                <div class="text-gray-500 text-sm">
                    © 2025 Umsetzungslabor Bauturbo
                </div>
                
                <nav class="flex gap-6">
                    
                    <a href="https://bauwende-allianz.org/impressum"

                    </a>

                </nav>

        </div>
    </footer>
</body>
</html>
