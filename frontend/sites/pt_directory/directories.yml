# Directory Configuration
# This file defines all directory pages, their data sources, and filtering options

directories:
  # Main Initiatives Directory
  - id: projects
    name: Projekte
    path: /projekte
    description: Browse all project initiatives
    nocodb:
      table_id: m1upwxd94s5tx1q
      view_id: vw0efitq0kedrj5l
    display:
      title_field: Title
      description_field: Zusammenfassung
      status_field: Status
    filters:
      - field: Status
        label: Status
        type: multi_select
      - field: Kategorie
        label: Kategorie
        type: multi_select
      - field: Tag
        label: Tags
        type: multi_select
  - id: kommunale_praxis
    name: Kommunale Praxis
    path: /praxis
    description: Browse initiatives from municipal practice
    nocodb:
      table_id: mk0mt3yqjbo3o5h
      view_id: vw64dhfjdahf1c1u
    display:
      title_field: Title
      description_field: Zusammenfassung
      status_field: Status
    filters:
      - field: Kategorie
        label: Kategorie
        type: single
    
