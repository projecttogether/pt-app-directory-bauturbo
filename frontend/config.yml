# Site information
site:
    name: "Umsetzungslabor Praxiswissen"
    domain: "praxiswissen.umsetzungslabor-bauturbo.de"

# Theme customization
theme:
    colors:
        primary_accent: "#007194" #blue
        primary_accent_light: "#87bccd"
        secondary_accent: "#cd5038" #red
        background: "#ffffff"
        text: "#3c3c3c"
        gray_light: "#e0e0e0"
        gray_dark: "#ACACAC"
    fonts:
        heading: "Inter, system-ui, sans-serif"
        body: "Inter, system-ui, sans-serif"

# Branding
branding:
    logo: "/assets/logos/logo_bauturbo.png"
    favicon: "/assets/favicons/logo_bauwende.png"

# Header navigation
header_menu:
    - label: "Einstieg"
      url: "#"
      external: false
    - label: "Arbeitshilfen"
      url: "#"
      external: false
    - label: "Verzeichnis"
      url: "#"
      external: false
    - label: "Über das Projekt"
      url: "/ueber/"
      external: false
    - label: "FAQ Bau-Turbo"
      url: "https://www.bmwsb.bund.de/DE/bauen/baurecht/bau-turbo/bau-turbo.html"
      external: true
    - label: "Kontakt"
      url: "/kontakt/"
      external: false
    - label: "Leichte Sprache"
      url: "/leichte-sprache/"
      external: false

# Footer configuration
footer:
    text: "© Umsetzungslabor Bauturbo"
    menu:
        - label: "Impressum"
          url: "https://bauwende-allianz.org/impressum"
        - label: "Datenschutz"
          url: "https://bauwende-allianz.org/datenschutzerklaerung"

# Pages configuration
pages:
    nocodb:
        table_id: m0slsgsuwtzmzn9
        view_id: vw8ca2dnu232dqhi
    max_sections: 8
    nocodb_fields:
        page_id: page_id
        title: title
        permalink: permalink
        publish: publish

