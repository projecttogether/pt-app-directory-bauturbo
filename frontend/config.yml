# Site information
site:
    name: "Umsetzungslabor Praxiswissen"
    domain: "praxiswissen.umsetzungslabor-bauturbo.de"

# Theme customization
theme:
    colors:
        primary_accent: "#007194" #blue
        primary_accent_light: "#87bccd"
        secondary_accent: "#cd5038" #red
        background: "#ffffff"
        text: "#3c3c3c"
        gray_light: "#e0e0e0"
        gray_dark: "#ACACAC"
    fonts:
        heading: "Inter, system-ui, sans-serif"
        body: "Inter, system-ui, sans-serif"

# Branding
branding:
    logo: "/assets/logos/logo_bauturbo.png"
    favicon: "/assets/favicons/logo_bauwende.png"

# Header navigation
header_menu:
    - label: "Arbeitshilfen"
      url: "#arbeitshilfen"
      external: false
    - label: "Praxiswissen"
      url: "#praxiswissen"
      external: false
    - label: "Über das Projekt"
      url: "#about"
      external: false
    - label: "Wissen einbringen"
      url: "https://forms.projecttogether.org/r/bau-turbo-praxiswissen"
      external: true
      is_btn: true
    - label: "Kontakt"
      url: "#mitgestalten"
      external: false
      is_btn: true

# Footer configuration
footer:
    text: "© Bauwende Allianz und Bundesministerium für Wohnen, Stadtentwicklung und Bauwesen, 2026"
    menu:
        - label: "Impressum"
          url: "https://bauwende-allianz.org/impressum"
        - label: "Datenschutz"
          url: "https://bauwende-allianz.org/datenschutzerklaerung"

# Pages configuration
pages:
    nocodb:
        table_id: m6bsb0bhilydrdd
        view_id: vw52xovvwfpl9ewq
    max_sections: 8
    nocodb_fields:
        page_id: page_id
        title: title
        permalink: permalink
        publish: publish

# Temp. workaround to include hardcoded section IDs for home page
section_ids_home:
    - "hero"
    - "einstieg"
    - "arbeitshilfen"
    - "praxiswissen"
    - "mitgestalten"
    - "about"

